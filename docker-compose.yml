name: caddycomfort

services:
  # Internal only. No `ports:` mapping and NOT on afrisinc_net, so it is
  # unreachable from the host, from the internet, and from the other services
  # sharing afrisinc_net. Only the frontend container can talk to it.
  caddycomfort-backend:
    image: ghcr.io/${GHCR_OWNER:-afrisinc}/caddycomfort-backend:${IMAGE_TAG:-main}
    container_name: caddycomfort-backend
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    expose:
      - '5000'
    env_file: .env
    environment:
      - TZ=UTC
      - NODE_ENV=production
      - PORT=5000
      # This image is the API only; the frontend container serves Next.js.
      - SERVE_FRONTEND=false
    # Bypass the host's systemd-resolved stub (127.0.0.53), which containers
    # can't reach — without this, outbound DNS (Supabase, Cloudinary, payment
    # webhooks) can silently fail depending on host resolver config.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # healthcheck inherited from the image
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    deploy:
      resources:
        limits: { memory: 512M, cpus: '1.0' }

    networks:
      - caddycomfort_internal

  # The only published service. Joins afrisinc_net so the host reverse proxy
  # and sibling services can reach it, and caddycomfort_internal to reach the API.
  caddycomfort-frontend:
    image: ghcr.io/${GHCR_OWNER:-afrisinc}/caddycomfort-frontend:${IMAGE_TAG:-main}
    container_name: caddycomfort-frontend
    build:
      context: ./frontend
      args:
        # Relative path -> the browser calls this container, which nginx
        # proxies to the API over caddycomfort_internal.
        VITE_API_URL: /api
        VITE_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
        # Baked into the nginx proxy_pass target at build time; must match
        # the API's container_name, which is how docker DNS resolves it.
        BACKEND_INTERNAL_URL: http://caddycomfort-backend:5000
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-5001}:3000'
    env_file: .env
    environment:
      - TZ=UTC
    depends_on:
      caddycomfort-backend:
        condition: service_healthy
    # healthcheck inherited from the image
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    deploy:
      resources:
        limits: { memory: 768M, cpus: '1.0' }

    networks:
      - caddycomfort_internal
      - afrisinc_net

  # One-shot: docker compose --profile migrate run --rm migrate
  migrate:
    image: ghcr.io/${GHCR_OWNER:-afrisinc}/caddycomfort-backend:${IMAGE_TAG:-main}
    build:
      context: ./backend
    profiles: ['migrate']
    restart: 'no'
    init: true
    env_file: .env
    environment:
      - TZ=UTC
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: ['npx', 'prisma', 'migrate', 'deploy']
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    networks:
      - caddycomfort_internal

networks:
  # Private to this stack — created by compose, carries frontend <-> API only.
  caddycomfort_internal:
    driver: bridge
  # Shared VPS network, created outside this stack.
  afrisinc_net:
    external: true
