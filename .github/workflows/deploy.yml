name: Deploy Clementine Shop — Production

on:
  push:
    branches:
      - main # deploy on pushes to main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_GHCR_USERNAME: ${{ secrets.DEPLOY_GHCR_USERNAME }}
      DEPLOY_GHCR_TOKEN: ${{ secrets.DEPLOY_GHCR_TOKEN }}

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set image tags
      - name: Set image tags
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "production_tag=production" >> $GITHUB_OUTPUT

      # Step 3: Login to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_OWNER }} # org name, e.g., afrisinc
          password: ${{ secrets.GHCR_TOKEN }} # your PAT

      # Step 4: Build Docker images
      - name: Build backend image
        run: |
          docker build \
            -t ghcr.io/${{ secrets.GHCR_OWNER }}/clementine-backend:${{ steps.meta.outputs.short_sha }} \
            -t ghcr.io/${{ secrets.GHCR_OWNER }}/clementine-backend:${{ steps.meta.outputs.production_tag }} ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=/api \
            --build-arg NEXT_PUBLIC_APP_URL=${{ secrets.PUBLIC_APP_URL }} \
            --build-arg BACKEND_INTERNAL_URL=http://backend:5000 \
            -t ghcr.io/${{ secrets.GHCR_OWNER }}/clementine-frontend:${{ steps.meta.outputs.short_sha }} \
            -t ghcr.io/${{ secrets.GHCR_OWNER }}/clementine-frontend:${{ steps.meta.outputs.production_tag }} ./frontend

      # Step 5: Push Docker images
      - name: Push Docker images
        run: |
          docker push ghcr.io/${{ secrets.GHCR_OWNER }}/clementine-backend:${{ steps.meta.outputs.short_sha }}
          docker push ghcr.io/${{ secrets.GHCR_OWNER }}/clementine-backend:${{ steps.meta.outputs.production_tag }}
          docker push ghcr.io/${{ secrets.GHCR_OWNER }}/clementine-frontend:${{ steps.meta.outputs.short_sha }}
          docker push ghcr.io/${{ secrets.GHCR_OWNER }}/clementine-frontend:${{ steps.meta.outputs.production_tag }}

      # Step 6: SSH deploy to VPS
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m

          # 🔐 PASS DEPLOY CREDS TO VPS
          envs: DEPLOY_GHCR_USERNAME,DEPLOY_GHCR_TOKEN
          script: |
            set -e
            APP_PATH="${{ secrets.VPS_APP_PATH }}/clementine-shop/production"
            cd $APP_PATH

            echo "$DEPLOY_GHCR_TOKEN" | docker login ghcr.io -u "$DEPLOY_GHCR_USERNAME" --password-stdin

            # Export required environment variables for docker-compose
            export GHCR_OWNER="${{ secrets.GHCR_OWNER }}"
            export IMAGE_TAG="${{ steps.meta.outputs.short_sha }}"

            docker compose pull

            # Apply pending prisma migrations before the new code serves traffic
            docker compose --profile migrate run --rm migrate

            docker compose up -d
            docker image prune -af
