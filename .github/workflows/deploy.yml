name: Deploy CaddyComfort — Production

on:
  push:
    branches:
      - main # deploy on pushes to main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_GHCR_USERNAME: ${{ secrets.DEPLOY_GHCR_USERNAME }}
      DEPLOY_GHCR_TOKEN: ${{ secrets.DEPLOY_GHCR_TOKEN }}

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set image tags
      - name: Set image tags
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "branch_tag=main" >> $GITHUB_OUTPUT

      # Step 3: Login to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_OWNER }} # org name, e.g., afrisinc
          password: ${{ secrets.GHCR_TOKEN }} # your PAT

      # Step 4: Set up Buildx for layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 5: Build and push backend image
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_OWNER }}/caddycomfort-backend:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ secrets.GHCR_OWNER }}/caddycomfort-backend:${{ steps.meta.outputs.branch_tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Step 6: Build and push frontend image
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_APP_URL=${{ secrets.PUBLIC_APP_URL }}
            BACKEND_INTERNAL_URL=http://caddycomfort-backend:5000
          tags: |
            ghcr.io/${{ secrets.GHCR_OWNER }}/caddycomfort-frontend:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ secrets.GHCR_OWNER }}/caddycomfort-frontend:${{ steps.meta.outputs.branch_tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Step 7: SSH deploy to VPS
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m

          # 🔐 PASS DEPLOY CREDS TO VPS
          envs: DEPLOY_GHCR_USERNAME,DEPLOY_GHCR_TOKEN
          script: |
            set -e
            APP_PATH="${{ secrets.VPS_APP_PATH }}/caddycomfort/production"
            cd $APP_PATH

            echo "$DEPLOY_GHCR_TOKEN" | docker login ghcr.io -u "$DEPLOY_GHCR_USERNAME" --password-stdin

            # Export required environment variables for docker-compose
            export GHCR_OWNER="${{ secrets.GHCR_OWNER }}"
            export IMAGE_TAG="${{ steps.meta.outputs.short_sha }}"

            # afrisinc_net is declared external; compose errors out instead of
            # creating it, so make sure it is there before pulling.
            docker network inspect afrisinc_net >/dev/null 2>&1 \
              || docker network create afrisinc_net

            docker compose pull

            # Apply pending prisma migrations before the new code serves traffic
            docker compose --profile migrate run --rm migrate

            docker compose up -d --remove-orphans

            # Fail the deploy if the stack does not actually come up healthy
            PORT=$(grep -E '^FRONTEND_PORT=' .env | cut -d= -f2 || true)
            PORT=${PORT:-5001}
            for i in $(seq 1 24); do
              if curl -fsS "http://127.0.0.1:${PORT}/api/health" >/dev/null 2>&1; then
                echo "✅ frontend up and proxying to the API"
                docker image prune -af
                exit 0
              fi
              sleep 5
            done

            echo "❌ stack did not become healthy within 2 minutes"
            docker compose ps
            docker compose logs --tail=120
            exit 1
